# Manifest of option_open_resolve_jp: the evening resolve of the JP contracts of the band into master.option_contract.
version = 1
id = "option_open_resolve_jp"
zone = "Asia/Tokyo"
budget_minutes = 20
# No count cap (docs/design/option-open-limits.md, Decision 1): 0 means none.
max_new = 0
# Contracts asked at once; equal to ResolveInFlight of the broker and the details lane of pyside.
parallel = 5
retry_days = 7
jitter_days = 2
spot_move = 0.05
lookahead_days = 4
gap_only = false

[window]
rule = "after_close"
lateness_hours = 5
calendar = "XTKS"

# One hour after the close.
[schedule]
calendar = "XTKS"
anchor = "session_close"
offset = "60m"
run_bound = "10m"
restart_sensitive = false

[params]
store_k = 1.75
store_drop = 0.25
calls = "held"
min_dte = 14
max_dte = 90
min_puts = 6
