# Manifest of the option_candidates_jp job: once per XTKS session day, five minutes after the open and after
# option_open_jp, the yen put candidates of the JP watch names (design candidates-jp, Decisions 1, 3, 5, 11).
version = 1
id = "option_candidates_jp"

[schedule]
calendar = "XTKS"
anchor = "session_open"
zone = "Asia/Tokyo"
offset = "5m"
run_bound = "10m"
restart_sensitive = false
# The jobs of the same day this job waits for: the JP open pull.
after = ["option_open_jp"]

# Limits of the put rule in yen. Every number below is a trial value, not the owner's word.
[params]
# trial: the floor of 21 days is the day the common practice manages or closes (open near 45 DTE, manage at 21 DTE; the
# practice is named by third-party summaries and is not verified at its source page); it is kept from the US job.
min_dte = 21 # trial
# trial: JPX lists 2 consecutive near-term months plus 2 months of the March cycle, and the last trading day is the
# business day before the second Friday of the expiry month, so two expiries are at most about 35 days apart; a window
# at least 35 days wide always holds an expiry (21 to 45 was 24 days wide and held none on 2026-11-20). 60 days opens
# near the 45 DTE entry of that practice and leaves room for the next monthly expiry.
max_dte = 60 # trial
min_bid_size = 1 # trial
max_spread = "0.30" # trial: 30 percent of mid
min_open_interest = 10 # trial
div_guard_factor = "1.0"
max_rate_age_days = 7
max_event_age_sessions = 2
min_report_gap_days = 60

# The chain of a name is the option_open_jp rows of the day in JPY; there is no eod fallback (Decision 5).
# oi_lookback_sessions is the XTKS session days searched back in option_eod for the open interest of an open row.
[source]
open_min_rows = 1
need_high = "1.05"
oi_lookback_sessions = 3
currency = "JPY"
eod_fallback = false
