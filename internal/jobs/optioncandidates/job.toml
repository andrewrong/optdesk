# Manifest of the option_candidates job: once per XNYS session day, five minutes after the open and after option_open.
version = 1
id = "option_candidates"

[schedule]
calendar = "XNYS"
anchor = "session_open"
zone = "America/New_York"
offset = "5m"
run_bound = "10m"
restart_sensitive = false

# Limits of the put rule (design option-candidates, Decision 15).
[params]
min_dte = 21
max_dte = 45
min_bid_size = 1
max_spread = "0.10"
min_open_interest = 10
div_guard_factor = "1.0"
max_rate_age_days = 7
max_event_age_sessions = 2
min_report_gap_days = 60

# Where the chain of an underlying comes from (design candidates-at-open, Decision 1): the option_open rows of the
# day when at least open_min_rows put rows of the DTE window are quotes and, with a buy price, at most need_high
# times it (the high of the short_put [[need]] row below); else option_eod. oi_lookback_sessions is the session
# days searched back in option_eod for the open interest of an open row.
[source]
open_min_rows = 1
need_high = "1.05"
oi_lookback_sessions = 3

# What this strategy needs of the stored option chains (design option-capture-need, Decision 2). The DTE window
# is the [params] one. Every number below is trial.
# Short put: the top is the rule strike - bid <= BuyPrice read with a bid up to 5% of the buy price (Decision 6,
# rule 1 of option-candidates.md); the bottom is the capture's own floor, the rule has none.
[[need]]
strategy = "short_put"
group = "watch:options"
rights = ["P"]
ref = "buy_price"
low = "0.80"
high = "1.05"
expiry = "all"

# Covered call: the rule floors the strike at the sale price or cost (Decision 11 of option-candidates.md); the
# reach from spot is the capture's own band.
[[need]]
strategy = "covered_call"
group = "watch:options"
rights = ["C"]
ref = "spot"
low = "1.00"
high = "1.05"
expiry = "all"
