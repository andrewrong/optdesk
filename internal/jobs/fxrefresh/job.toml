# Manifest of the fx_refresh job: the daily USD.JPY mid after each XNYS close.
version = 1
id = "fx_refresh"
duration_days = 5
# The rank: the first is the primary (upsert), each later one fills days the table has no row for (insert only).
sources = ["ibkr_midpoint", "fred_h10"]
fill_lookback_days = 14

[schedule]
calendar = "XNYS"
anchor = "session_close"
offset = "15m"
run_bound = "10m"
