# Manifest of the option_eod job. The underlying is SPY, one real symbol.
version = 1
id = "option_eod"
zone = "America/New_York"
slot = "close-120m"
max_expiries = 3
strike_band = 0.10
max_strikes_per_side = 8
# Used only with a watch list (NewWithWatch): DTE window of the expiries and the cap of strikes per buy-price range.
strike_band_below = 0.20
strike_band_above = 0.05
min_dte = 14
max_dte = 56
max_strikes = 24
# Buy-price band of an entry with a BuyPrice: strikes from buy_low x BuyPrice to max(buy_high x BuyPrice, spot). The numbers are trial.
buy_low = "0.80"
buy_high = "1.05"
chunk = 50
budget_minutes = 8
freeze_after = "1615"
option_price_increment = "0.01"

[window]
rule = "in_session"
open_after_minutes = 90
calendar = "XNYS"

[[underlying]]
symbol = "SPY"
sec_type = "STK"
exchange = "SMART"
currency = "USD"
con_id = 756733
mic = "ARCX"
calendar_id = "XNYS"
price_increment = "0.01"
lot_size = "1"

# Slot: 120 minutes before the calendar close (14:00 New York, 11:00 on a half day), inside the session. budget_minutes and
# run_bound count for one key (one underlying), not for the whole run. A run of many names takes about 75 minutes and ends
# about two hours after its start, inside the session.
[schedule]
calendar = "XNYS"
anchor = "session_close"
offset = "-120m"
run_bound = "14m"
restart_sensitive = true
