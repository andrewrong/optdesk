# Manifest of the option_eod job. The underlying is SPY, one real symbol.
version = 1
id = "option_eod"
zone = "America/New_York"
max_expiries = 3
strike_band = 0.10
max_strikes_per_side = 8
# Used only with a watch list (NewWithWatch): DTE window of the expiries and the cap of strikes per buy-price range.
min_dte = 21
max_dte = 45
max_strikes = 24
chunk = 50
budget_minutes = 8
freeze_after = "1615"
option_price_increment = "0.01"

[window]
rule = "after_close"
lateness_hours = 5
calendar = "XNYS"

[[underlying]]
symbol = "SPY"
sec_type = "STK"
exchange = "SMART"
currency = "USD"
con_id = 756733
mic = "ARCX"
calendar_id = "XNYS"
price_increment = "0.01"
lot_size = "1"

# Proposed slot: at the close; the bound is 8 minutes plus the job's own budget_minutes.
[schedule]
calendar = "XNYS"
anchor = "session_close"
offset = "0s"
run_bound = "16m"
restart_sensitive = true
