name: ui-shots

# Renders every fixture page of web/ at widths 390 and 1280 and uploads the PNGs as the
# artifact ui-shots, which crew hands to the reviewer (agent-crew design ui-shots, entry 3).
on:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/index.html'
      - 'web/fixtures/**'
      - '.github/workflows/ui-shots.yml'

permissions:
  contents: read

jobs:
  ui-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # pnpm version comes from the packageManager field of the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm --dir web run build
      - name: install chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: render pages
        run: pnpm --dir web exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots
          path: web/e2e/out
          if-no-files-found: error
          retention-days: 7
