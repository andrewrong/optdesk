name: ci-pyside

on:
  pull_request:
    paths:
      - 'pyside/**'
      - '.github/workflows/ci-pyside.yml'
  push:
    branches: [main]
    paths:
      - 'pyside/**'
      - '.github/workflows/ci-pyside.yml'

permissions:
  contents: read

jobs:
  pyside:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pyside
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: uv sync
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check
      - name: mypy
        run: uv run mypy --strict src tests
      - name: pytest
        run: uv run pytest -n auto
