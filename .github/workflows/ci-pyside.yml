name: ci-pyside

on:
  pull_request:
    paths:
      - 'pyside/**'
      - '.github/workflows/ci-pyside.yml'
  push:
    branches: [main]
    paths:
      - 'pyside/**'
      - '.github/workflows/ci-pyside.yml'
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyside:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pyside
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: uv sync
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check
      - name: mypy
        run: uv run mypy --strict src tests
      - name: pytest
        run: |
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then export TMPDIR=/dev/shm; fi
          uv run pytest -n auto
