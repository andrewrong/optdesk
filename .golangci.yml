version: "2"
run:
  tests: true
linters:
  default: standard
  enable:
    - depguard
    - noctx
    - contextcheck
    - forbidigo
    - exhaustive
    - gocyclo
    - funlen
    - lll
    - errorlint
    - modernize
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - fatcontext
    - nakedret
    - reassign
    - rowserrcheck
    - testableexamples
    - unconvert
    - wastedassign
    - makezero
    - predeclared
    - usestdlibvars
    - canonicalheader
  settings:
    depguard:
      rules:
        pgx:
          files:
            - $all
            - "!**/internal/store/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: only internal/store may import pgx
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: a test never sleeps and code waits on a clock; use internal/clock
        - pattern: ^time\.Now$
          msg: time comes from internal/clock
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    lll:
      line-length: 160
  exclusions:
    rules:
      - path: internal/clock/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - funlen
      - path: internal/compute/valuation/price_return.go
        # content pinned by hash: it cannot change, and a nolint comment would change it
        linters:
          - modernize
      # Kept: pinned by rule hashes
      - path: internal/compute/ease/ease\.go$
        linters:
          - modernize
      # Kept: pinned by rule hashes
      - path: internal/compute/ease/netliquidity\.go$
        linters:
          - modernize
      # Kept: pinned by rule hashes
      - path: internal/compute/valuation/arith\.go$
        linters:
          - modernize
      # Kept: pinned by rule hashes
      - path: internal/compute/valuation/capital\.go$
        linters:
          - modernize
      # Kept: pinned by rule hashes
      - path: internal/compute/valuation/paths\.go$
        linters:
          - modernize
      # Kept: pinned by rule hashes
      - path: internal/compute/valuation/reverse\.go$
        linters:
          - modernize
      # Kept: marks.go is held by the marksSignOnly purity rule
      - path: internal/pages/option_pnl_page/marks\.go$
        linters:
          - modernize
      # P8: errorlint cleanup follow-up
      - path: internal/jobs/datacheck/rules_more_test\.go$
        linters:
          - errorlint
      # P8: pinned file
      - path: internal/compute/valuation/(gate|filings|filings_test)\.go$
        linters:
          - makezero
          - wastedassign
          - predeclared
      # P8: pinned file
      - path: internal/compute/ivbar/ivbar\.go$
        linters:
          - predeclared
      # P8: interface file
      - path: internal/compute/valuelinesapi/api\.go$
        linters:
          - predeclared
formatters:
  enable:
    - gofmt
    - goimports
