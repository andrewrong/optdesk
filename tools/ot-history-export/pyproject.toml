[project]
name = "ot-history-export"
version = "0.1.0"
description = "Dev-only exporter of option-trader account snapshots and old figures to JSON Lines (not in CI, not at run time)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ot_history_export"]

[tool.pytest.ini_options]
pythonpath = ["src"]
