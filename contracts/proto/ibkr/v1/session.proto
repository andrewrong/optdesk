syntax = "proto3";

package ibkr.v1;

import "ibkr/v1/quote_types.proto";

option go_package = "github.com/andrewrong/optdesk/internal/contracts/genpb";

// Session is the liveness probe of the broker transport.
service SessionService {
  // Ping asks the transport whether the broker session is up.
  rpc Ping(PingRequest) returns (PingResponse);
}

// PingRequest carries nothing: a Ping needs no arguments.
message PingRequest {}

// PingResponse tells whether the broker session is connected.
message PingResponse {
  // connected is true while the broker session is up.
  bool connected = 1;
  // generation is 0 before the first connect and goes up by one at each
  // reconnect; quotes of two generations are from two sessions.
  int64 generation = 2;
  // market_data_type is the type set on the current session.
  MarketDataType market_data_type = 3;
}
