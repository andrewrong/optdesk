syntax = "proto3";

package ibkr.v1;

option go_package = "github.com/andrewrong/optdesk/internal/contracts/genpb";

// The market-data type is one setting of the gateway session, not of a request.
// Pyside sets it once after each connect from its configuration and reports it
// in PingResponse; a reconnect sets it again before any quote is served.
enum MarketDataType {
  MARKET_DATA_TYPE_UNSPECIFIED = 0;
  MARKET_DATA_TYPE_LIVE = 1;
  MARKET_DATA_TYPE_FROZEN = 2;
  MARKET_DATA_TYPE_DELAYED = 3;
  MARKET_DATA_TYPE_DELAYED_FROZEN = 4;
}

// QuoteKind selects the specification of a snapshot. Specification of each
// kind, held in pyside (spec.py) and written here so the caller knows what it
// gets:
//   OPTION_EOD: a short streaming subscription per option with generic ticks
//     100 and 101, released as soon as bid, ask, close and the model values
//     have arrived; at most 20 s; wanted fields bid, ask, close, volume,
//     open_interest, model values.
//   UNDERLYING_IV: a short streaming subscription per stock or index with
//     generic ticks 104 and 106, released when option_implied_vol and
//     historical_vol have arrived; at most 20 s.
//   SNAPSHOT: the current quote fields of one contract: a short streaming
//     subscription with no generic ticks (the default ticks only), released as
//     soon as bid and ask have arrived; at most 20 s; wanted fields bid, ask,
//     last, bid_size, ask_size, last_size, close, volume and the event time.
//   OPTION_OPEN: the option quote of the open pull: a short streaming
//     subscription per option with generic ticks "100,101", released as soon as
//     bid, ask and the model values have arrived; at most 15 s; no
//     open-interest grace (it is not waited for at the open).
// These first values are corrected from the owner's live measurement (ADR 0003:
// measure first), which is a change of comment and table, not of shape.
enum QuoteKind {
  QUOTE_KIND_UNSPECIFIED = 0;
  QUOTE_KIND_OPTION_EOD = 1;
  QUOTE_KIND_UNDERLYING_IV = 2;
  QUOTE_KIND_SNAPSHOT = 3;
  QUOTE_KIND_OPTION_OPEN = 4;
}

// QuoteStatus is the outcome of one quote.
enum QuoteStatus {
  QUOTE_STATUS_UNSPECIFIED = 0;
  QUOTE_STATUS_OK = 1;
  QUOTE_STATUS_PARTIAL = 2;
  QUOTE_STATUS_NO_DATA = 3;
  QUOTE_STATUS_NO_SUBSCRIPTION = 4;
  QUOTE_STATUS_TIMEOUT = 5;
  QUOTE_STATUS_ERROR = 6;
  QUOTE_STATUS_DISCONNECTED = 7;
}

// MissingReason says why an optional Quote field is unset.
enum MissingReason {
  MISSING_REASON_UNSPECIFIED = 0;
  // No tick for the field by the time the quote ended or was released (the
  // item timeout of the kind, or the release of the line for a field no wait
  // holds back).
  MISSING_REASON_NOT_RECEIVED_RELEASE = 1;
  // The field is a grace field of the kind (open_interest of OPTION_EOD) and
  // its grace wait ended without it.
  MISSING_REASON_NOT_RECEIVED_GRACE = 2;
  // The ticker held a value pyside drops (a negative or other sentinel, not
  // NaN, which is "not yet set").
  MISSING_REASON_INVALID = 3;
  // The quote ended with an IBKR error; error_code is its code.
  MISSING_REASON_ERROR = 4;
  // Ticks arrived for the field but every one is 0.0 (both call and put open
  // interest are 0.0).
  MISSING_REASON_RECEIVED_ZERO = 5;
  // The market data type of the quote at the end is not 1 (live), i.e. delayed,
  // frozen or delayed frozen (2, 3, 4), and the field is missing.
  MISSING_REASON_MARKET_DATA_TYPE = 6;
}
