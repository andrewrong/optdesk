[project]
name = "optdesk"
version = "0.1.0"
description = "optdesk Python side"
requires-python = ">=3.12"
dependencies = [
    "exchange_calendars>=4,<5",
    "ib-async>=2.1,<3",
    "grpcio>=1.85.1,<2",
    "protobuf>=7,<8",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "mypy",
    "ruff",
    "grpcio-tools>=1.85.1,<2",
    "types-grpcio",
    "mypy-protobuf",
    "import-linter>=2.16",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["exchange_calendars"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["src/optdesk/contracts/genpb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-n auto"

[tool.importlinter]
root_package = "optdesk"

[[tool.importlinter.contracts]]
name = "the generated package is reached only through optdesk.contracts.api"
type = "forbidden"
source_modules = ["optdesk.calendar", "optdesk.ibkr"]
forbidden_modules = ["optdesk.contracts.genpb"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "calendar and ibkr do not import each other"
type = "independence"
modules = ["optdesk.calendar", "optdesk.ibkr"]

[[tool.importlinter.contracts]]
name = "contracts imports neither calendar nor ibkr"
type = "forbidden"
source_modules = ["optdesk.contracts"]
forbidden_modules = ["optdesk.calendar", "optdesk.ibkr"]
