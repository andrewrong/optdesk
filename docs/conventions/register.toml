pages = ["structure_detail.legs.pnl", "structure_detail.legs.mark", "structure_detail.legs_total.pnl"]
formula = """
The profit of one leg now, signed: signed quantity (contracts, short negative) x multiplier x (mark - opening price). The mark is the mid of the bid and ask of the stored IBKR quote of the leg, rounded half-even to 4 places; a quote with a bid of zero or no ask has no mark (Decision 7). The opening price is the Flex tradePrice of the opening row of the ledger position, per share, as decimal text (version 1 used the gateway's snapshot market price and cost basis). The 合计 row is the exact sum of the legs' profits, written to 4 places half-even, and equals structure.unrealized_pnl. Synthetic: short put 1 x 100 x (1.00 - 1.50) = +50.0000; long put 1 x 100 x (0.40 - 0.50) = -10.0000; total +40.0000."""
inputs = """
The ledger positions of the structure (Flex replay): right, strike, expiry, signed quantity, multiplier, OpenPrice; the stored IBKR quote of each leg (bid, ask, day), matched by (underlying, right, strike, expiry)."""
period_date = "The day of the stored quote; the opening price is that of the opening Flex row."
currency = "The contract currency, exact decimal text. A JPY structure is not converted and has a gap."
excludes = """
Commissions (shown by structure.recent_commission); assignment, exercise and expiry; the last traded price; any price optdesk would compute itself."""
gap_text = """
A leg without a mark is a gap with a named reason: missing_quote (no mark), stale_input (the quote is older than MarkMaxAgeSessions session days), unsupported_currency (a JPY structure: figures are in the contract currency, no FX), no_rule (an 'other' structure or a naked call), no_data (an input is absent). A partial sum is never shown; never a zero."""
implemented_by = [
  "internal/compute/optionstruct.marker.markOf",
  "internal/compute/optionstruct.midOf",
  "internal/compute/optionstruct.unrealized",
]
