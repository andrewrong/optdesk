[[figure]]
id = "home.options_summary.monthly_premium"
version = 1
title_zh = "首页期权摘要：每月权利金（近 6 个月柱图）"
pages = ["options_summary.card.premium_series_6m.premium"]
formula = """
One bar per calendar month, six months ending with the month of the session day. A month's figure is \
the premium taken in (本月新收): the sum, over the household's accounts, of the opening cash of the \
month's book A openings (sold and protective) net of the opening commission and tax, signed. The \
month of an opening is its US Eastern date. The current month runs through the session day; a past \
month runs through its last day. A roll adds the new opening only; closing cost is not netted."""
inputs = """
Flex trade openings (one record per execution, the highest revision of equal account and trade id); \
the stored Flex statement span of each account (coverage); the stored JPY per USD rate of the \
opening's US Eastern date for a JPY-base account; the accounts the adapter holds for review."""
period_date = "Calendar month by the US Eastern (America/New_York) date of the opening; the current month through the session day, a past month through its last day."
currency = """
Base currency of the figure: USD. An opening of a USD-base account is cash x fxRateToBase; of a \
JPY-base account cash x fxRateToBase / (JPY per USD of the opening's US Eastern date). Full \
precision, summed per account, rounded half-even to 2 places; the household is the sum of the \
computable accounts' rounded amounts."""
excludes = """
Closing cost of a roll; a position's later shrinking, assignment or expiry; an account not covered \
by a statement span through the month (a past month needs a span from its first day to the day after \
its last); an account held for review; an account without a zone or a usable rate."""
gap_text = """
No account computable: a no_data gap, '<MM> 月暂无数据：成交记录未覆盖' when every account is not \
covered, else '<MM> 月暂无数据：账户待核对或缺日元汇率'. Some accounts left out: a no_data gap \
'<MM> 月仅部分账户有数据' for a past month. Never a zero."""
implemented_by = [
  "option_trader.viewmodels.options_figures._series",
  "option_trader.readings.premium_received.premium_received",
]
source_hash = "pending-recompute"
agreed_on = "2026-11-03"
agreed_in = "carried over from option-trader"
history = ["2026-11-03 v1: bootstrap from the code as it is; no figure changed."]

[[figure]]
id = "home.options_summary.monthly_closed"
version = 1
title_zh = "首页期权摘要：每月已了结（柱旁数字）"
pages = ["options_summary.card.premium_series_6m.closed"]
formula = """
Shown beside the bar of each of the six months and never added to or subtracted from it. A month's \
figure is the closing cash of the month netted, as net paid: the sum of Closing.closing_cash over \
every lot (sold and protective legs) of the household's Flex structures whose closing falls in the \
month, with the sign reversed (a buy-to-close is cash out, a long-leg sale cash in). Synthetic: 9,400 \
bought to close with 8,650 of long-leg sales shows $750 paid; a net received shows a minus sign. The \
month of a closing is its US Eastern trade date; the current month runs through the session day."""
inputs = """
The Flex structures of the household accounts (lots and their closings, closing cash signed from the \
account); the stored JPY per USD rate of the session day for a JPY account; the premium figure of the \
same month, whose gap decides a month the premium cannot show."""
period_date = "Calendar month by the US Eastern (America/New_York) trade date of the closing; the current month through the session day, a past month through its last day."
currency = """
Base currency of the figure: USD. A USD closing is cash as the broker gives it; a JPY closing is \
divided by the DEXJPUS of the session day (JPY per USD). Full precision, summed, rounded to the \
cent half up, shown in whole dollars."""
excludes = """
Openings and their fees (they are the bar, not this figure); the share delivery of an assignment or \
exercise; the books' result (this is cash, not profit); an account not in the household."""
gap_text = """
A month the premium shows as a gap (not covered by a statement span, or only some accounts) is the \
same gap here, so the partial-account rule of the premium holds. A JPY closing in the month without \
a stored rate: a no_data gap '已了结暂无数据：缺日元汇率 DEXJPUS', never a smaller sum. A month with no \
closing is $0, not a gap."""
implemented_by = [
  "option_trader.viewmodels.options_figures._closed_series",
]
