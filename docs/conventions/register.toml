[[figure]]
id = "market.ivp_own"
version = 1
title_zh = "自有 IV 百分位"
pages = []
formula = """
Convention ivp_v1: on the stored own IV30 series (market.iv30_own), the share of the past 252 valid sessions whose IV30 is at or below today's, today excluded (compare AtOrBelow). 0 to 1. Synthetic: window 0.10, 0.20, 0.30, 0.40 (shorter than 252, for the arithmetic) and today 0.30 give 0.75."""
inputs = """
The stored readings of market.iv30_own, the newest 252 before the as-of day and the value of the day; the newest point no older than 4 calendar days."""
period_date = "The as-of day of the stored IV30 reading."
currency = "Unit decimal, stored as decimal text, rounded half-even to 6 places. A share of sessions, 0 to 1."
excludes = """
Today's value in the window; any IBKR IV history (no bootstrap); the legacy strictly-below rule of the N225_IV percentile."""
gap_text = """
Fewer than 252 valid sessions: missing, short_history. No IV30 of the day: missing, no_input. A missing input is stored as missing with a reason code (no_input, short_history, stale_input, zero_range or bad_input), never as a zero."""
implemented_by = [
  "internal/compute/figures.(*calc).IvPercentile",
]
