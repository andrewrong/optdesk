The share of the stored daily RVXCLS values in the 3 calendar years before the day, the day excluded, that are strictly below the value of the day (compare Below, the N225_IV rule of GLOSSARY.md). 0 to 1; the count of observations is stored beside it. Synthetic: four earlier values 10, 20, 30, 40 and a value of the day 30 give 0.5."""
inputs = """
The stored FRED series RVXCLS (index points) of the 3 calendar years before the day and the value of the day; the newest point no older than 8 calendar days."""
period_date = "The day of the newest FRED point used."
currency = "Unit decimal, stored as decimal text, rounded half-even to 6 places. A share of days, 0 to 1."
excludes = """
Today's value in the window; a filled session; a percentile of any series other than RVXCLS; an at-or-below count."""
gap_text = """
No history spanning 3 years: missing, short_history. No point within 8 days: missing, stale_input. A missing input is stored as missing with a reason code (no_input, short_history, stale_input, zero_range or bad_input), never as a zero."""
implemented_by = [
  "internal/compute/figures.(*calc).PercentileInYears",
]
