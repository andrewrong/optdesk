excludes = """
Today's value in the window; any IBKR IV history (no bootstrap); the legacy strictly-below rule of the N225_IV percentile."""
gap_text = """
Fewer than 252 valid sessions: missing, short_history. No IV30 of the day: missing, no_input. A missing input is stored as missing with a reason code (no_input, short_history, stale_input, zero_range or bad_input), never as a zero."""
implemented_by = [
  "internal/compute/figures.(*calc).IvPercentile",
]
