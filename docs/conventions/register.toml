id = "option.tracking.pnl_split"
version = 1
title_zh = "期权跟踪页：权利金与标的变动（到期）"
pages = ["tracking.rows.premium", "tracking.rows.underlying_move"]
formula = """
For a scanned short put graded at its expiry, per structure in the contract's currency. 权利金 (premium) \
is the credit of the grade terms: the net premium received for one contract, that is the credit per \
share times the multiplier. 标的变动 (underlying move) is minus the intrinsic value of the put at the \
expiry close, -max(strike - close, 0) x multiplier, the same intrinsic that strategies.grading pays out \
of the credit (expiry_intrinsic), rounded half up to the cent. 指派 is a state flag, 在价内到期, taken \
from the grade (any grade but OTM); it is not a P&L term and is not added to either figure. The two \
figures are not summed on the page. Synthetic: strike 50, credit 1.50 per share, multiplier 100: close \
46.00 gives 权利金 150.00, 标的变动 -400.00 and the flag (150 - 400 = -250.00 if held); close 52.00 \
gives 150.00, 0.00 and no flag."""
inputs = """
The stored evaluation of the scan (its legs and the net premium that the grader reads through \
short_put.expiry_terms); the current grade of that evaluation (grade_current: the newest, never a \
superseded row) for its status, grade and expiry close."""
period_date = "At the expiry date of the leg; the day the grade was decided on is the grade's own."
currency = "The contract's currency (a US put: USD), per structure; no conversion."
excludes = """
Fees of closing and of assignment, early assignment, the stock after an assignment (it belongs to the \
held structure), an exit before expiry, and any sum of the two figures as a result."""
