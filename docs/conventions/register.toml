[[figure]]
id = "household.month_change"
version = 1
title_zh = "家庭页：月度资产变化（瀑布）"
pages = ["household_page.month_change"]
formula = """
From the household total at the start of a calendar month to the total at its end, one line per step: \
月初 (start, the Flex household total). 入金 (deposits; named 出金 when negative): the sum of the \
household day deposits. 已平仓期权结果 (premium): the result of options closed in the month, expiry \
included, by close day; contracts still open are left out. 股息 (dividends): received dividends net of \
withholding tax (tax that cannot be told from dividend or interest counts as dividend). 利息 \
(interest): broker and bond interest, received positive, paid negative. 汇率 (fx): the currency \
effect (no per-currency history, so it stays empty inside 其他). 股票市值变动 (stock): the stock \
market value at the end minus at the start, from the statements. 期权市值变动 (options): the open \
options market value at the end minus at the start, from the statements. 其他 (rest): the total \
change minus all the steps above, the remainder. 月末 (end) is the start plus the steps."""
inputs = """
Closed option parts; cash-report rows (deposits, dividends, interest); net-asset-value rows (stock and \
option market value); the statement coverage of each account; the group file for the household \
members. Start and end are the statements of the last day of the previous month and of the month's \
last day, or the nearest earlier statement (the page says which day was used)."""
period_date = "Calendar month; start and end read from statements by report date, the page names a day that is not the calendar end."
currency = """
Base currency of the figure: USD as the broker gives it, no rate of this system. A JPY page shows \
the yen block with a display-only ≈USD beside it (rate stored with the snapshot). Rounded half-even \
to 2 places."""
excludes = """
Open contracts (no mark-to-market in 已平仓期权结果; their change is in 期权市值变动); position \
transfers and deposit-rate moves apply as the glossary's known holes say; fees and what the \
statements cannot split stay in 其他."""
gap_text = """
No month data: the block has no rows and a named gap. A month without a start or an end statement \
has no row set. A JPY block without a rate carries a count gap for the ≈USD figures. Never a zero."""
implemented_by = [
  "option_trader.viewmodels.household_page_builder._waterfall_block",
  "option_trader.readings.month_change._readings",
]
source_hash = "pending-recompute"
agreed_on = "2026-11-03"
agreed_in = "carried over from option-trader"
history = [
  "2026-11-03 v1: bootstrap from the code as it is; no figure changed.",
  "2026-11-03 v1: hash refreshed, semantics unchanged (base/height/result added to the waterfall).",
