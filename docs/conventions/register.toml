title_zh = "家庭页：未来 30 天到期的义务"
pages = ["household_page.obligations"]
formula = """
One row per short option contract group of the household's held positions that expires from the \
page's local date through 30 calendar days after it (both inclusive), sorted by expiry, \
account and name. A short put needs its gross put notional (strike x multiplier x contracts, plain \
arithmetic); a vertical is a row of its own paired contracts with the spread width. A call delivers \
shares and needs no cash. The block's totals are one per currency; nothing is converted or added \
across currencies, and ≈USD is display only."""
inputs = """
The latest complete account snapshots of the household members (positions, ledger cash); the group \
file; the open price per share of a leg when stored; the JPY per USD rate for the display-only ≈USD."""
period_date = "Window from today's local date to 30 days after, by the expiry date of the contract."
currency = """
Each row in its own currency (USD or JPY), cents; totals per currency; a display-only ≈USD total \
only when a JPY row and a rate exist. Rounded half-even."""
excludes = """
Working orders (not held); calls (no cash needed); expiries outside the window; stock covering a \
short put (no cross-account cover)."""
gap_text = """
No obligations data: the block carries a named gap and no rows. A row whose open price is not stored \
shows the gap words in the 开仓价 column. Never a zero."""
implemented_by = [
