formula = """
The sum over the household members of the broker's net liquidation value (NetLiquidation, USD), taken from the newest complete after-close snapshot of the household (the newest ok reading of household.net_liquidation, which may be of an earlier day than the page's). Shown in whole dollars half up ($412,300); the stored value to the cent. The text carries a leading ≈ when some member holds non-USD stock (a country row other than US with a positive value), because the converted part is the broker's ledger rate. The small line is the word USD. A negative net worth is not shown. Nothing is recomputed in the browser.
"""
inputs = """
The household.net_liquidation readings of the store (members' account snapshots, summed by the reading); the allocation header and country rows (for the ≈ mark); the group file and the Flex-only members (counted in the member count and, through their nav_day rows, in the reading).
