The legs of the structure with signed quantity, strike, right and multiplier from the instrument master; the opening price per share of each leg from the household gateways' newest complete snapshots."""
period_date = "At expiry of the legs; the opening prices are those of the newest complete snapshot of each gateway at build time."
currency = "USD. A structure in another currency is not built."
excludes = """
Fees and commissions; assignment and early exercise; the current mark (this is the expiry result, not the profit now); any stress or margin figure."""
gap_text = """
