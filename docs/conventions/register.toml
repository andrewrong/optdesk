title_zh = "报告页：成交类型"
pages = ["report_page.actions"]
formula = """
Each execution of the day is open, close or expire. The signed fill is positive for BOT and negative for SLD; the prior is the signed quantity of the same contract in the newest earlier capture. A fill that starts a position (prior 0) or has the sign of the prior is open; a fill against the prior is close, and expire when an option closes at price 0."""
inputs = """
The day's executions of the main alias; the signed quantity of each contract in the newest earlier capture."""
period_date = "The session day of the execution."
currency = "Not a money figure: kind text."
excludes = """
Assignment or exercise (the data does not tell it from a close); a fill that crosses zero counts as close."""
gap_text = """
No readable prior quantity: the row has no kind, never a guess."""
implemented_by = [
  "internal/compute/pagefig.trades",
  "internal/compute/pagefig.tradeKind",
]
